<style>
  .exp { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2933; }
  .exp h1 { margin-bottom: 4px; overflow-wrap: anywhere; }
  .exp h2 { margin-top: 28px; }
  .exp a { color: #2558c9; }
  .exp .muted { color: #616e7c; }
  .exp .crumbs { font-size: 0.9rem; margin-top: 16px; }
  .exp .table-wrap { overflow-x: auto; }
  .exp table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .exp th, .exp td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #e4e7eb; vertical-align: top; }
  .exp th { font-size: 0.85rem; color: #616e7c; font-weight: 600; white-space: nowrap; }
  .exp td.num, .exp th.num { text-align: right; white-space: nowrap; }
  .exp td.note { min-width: 240px; }
  .exp .badge { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: #e3f9e5; color: #18794e; border: 1px solid #a3d9a5; white-space: nowrap; }
  .exp .empty { border: 1px dashed #bcccdc; border-radius: 8px; padding: 16px; }
  .exp code { background: #f0f4f8; padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .exp .messages { list-style: none; padding: 0; }
  .exp .messages li { padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; }
  .exp .messages .success { background: #e3f9e5; color: #0e5c32; }
  .exp .messages .error { background: #fde8e8; color: #9b1c1c; }
  .exp .changed { background: #fff8e1; }
  .exp .up { color: #18794e; }
  .exp .down { color: #c81e1e; }
  .exp .chart { border: 1px solid #d9e2ec; border-radius: 8px; padding: 12px 16px; background: #fff; }
  .exp .chart-box { position: relative; height: 280px; }
  .exp button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #2558c9; background: #2558c9; color: #fff; cursor: pointer; }
  .exp button:disabled { background: #cbd2d9; border-color: #cbd2d9; cursor: not-allowed; }
  .exp button.secondary { background: #fff; color: #2558c9; }
  .exp select { font: inherit; padding: 4px 6px; }
  .exp .explanation { border-left: 4px solid #3e7bfa; background: #f5f8ff; padding: 12px 16px; border-radius: 4px; line-height: 1.5; }
</style>
{% if messages %}
  <div class="exp"><ul class="messages">{% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}</ul></div>
{% endif %}
